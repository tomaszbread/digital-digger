  <script id="dd-font-entry">
    (() => {
      if (!document.fonts) return;
      const root = document.documentElement;
      const faces = [
        { font: '400 16px "Schoolbell"', variable: '--dd-hand', fallback: 'cursive' },
        { font: '400 16px "Share Tech Mono"', variable: '--dd-mono', fallback: 'monospace' },
        { font: '400 16px "Inter"', variable: '--dd-sans', fallback: 'Arial, sans-serif' },
        { font: '500 16px "Inter"', variable: '--dd-sans', fallback: 'Arial, sans-serif' }
      ];
      root.dataset.ddFonts = 'loading';
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(deadline);
        let fallback = false;
        for (const face of faces) {
          if (document.readyState === 'loading' || !document.fonts.check(face.font)) {
            // A failed/very slow font must not block the page or swap in later.
            root.style.setProperty(face.variable, face.fallback);
            fallback = true;
          }
        }
        root.dataset.ddFonts = fallback ? 'fallback' : 'ready';
        document.dispatchEvent(new Event('dd:fonts-ready'));
      };
      const deadline = setTimeout(finish, 2500);
      document.addEventListener('DOMContentLoaded', () => {
        if (done) return;
        Promise.allSettled(faces.map(face => document.fonts.load(face.font))).then(finish);
      }, { once: true });
    })();
